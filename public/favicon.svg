<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Stack Ten">
  <defs>
    <radialGradient id="felt" cx="50%" cy="0%" r="110%">
      <stop offset="0%" stop-color="#1b6b66"/>
      <stop offset="55%" stop-color="#0f4c4c"/>
      <stop offset="100%" stop-color="#0a3535"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#felt)"/>

  <!-- Two cards fanned behind, in the colours the game gives 1 and 3. -->
  <g stroke="#fff" stroke-width="2.4">
    <rect x="10.5" y="18" width="21" height="29" rx="4" fill="#3E8FD8"
          transform="rotate(-21 21 32.5)"/>
    <rect x="32.5" y="18" width="21" height="29" rx="4" fill="#4FAE55"
          transform="rotate(21 43 32.5)"/>
  </g>

  <!-- The ten on top, in the colour the game gives that card. -->
  <rect x="19.5" y="15" width="25" height="35" rx="4.5" fill="#fff"
        stroke="#E23D3D" stroke-width="3.2"/>
  <g stroke="#E23D3D" stroke-linecap="round" fill="none">
    <path d="M25 27.2 27.2 25.4v12.9" stroke-width="3.4" stroke-linejoin="round"/>
    <rect x="31.6" y="25.2" width="8.6" height="13.1" rx="4.3" stroke-width="3.3"/>
  </g>
</svg>
